10034|<span style="color: rgb(0, 255, 0);">(Ali H.)</span><br><img src="images/paste-82a4bf897e6c97251d4e1891621f532604b33fce.jpg">|<img src="images/paste-2381b673878f19aca319c7abd804505aff2d4a55.jpg">|${PM4}
10035|(INC)<br>Énoncer le principe de Curie|Les éléments d'invariance et de symétrie des causes doivent se retrouver dans les effets produits.|${PEM1}
10036|(INC)<br>Quelles sont les dimensions de la densité volumique/surfacique/linéique de charge ?|densité volumique de charge ρ homogène à une charge divisée par un volume<br>unité:&nbsp;\\(C.m^{-3}\\)<br>densité surfacique de charge&nbsp;\\(\\sigma\\)&nbsp;homogène à une charge divisée par une surface<br>unité:&nbsp;\\(C.m^{-2}\\)<br>densité linéique de charge&nbsp;\\(\\lambda\\)&nbsp;homogène à une charge divisée par une longueur<br>unité:&nbsp;\\(C.m^{-1}\\)|${PEM1}
10037|<span style="color: rgb(0, 255, 0);">(INC)</span><br>Quelle est la charge d'un volume élémentaire dV? d'une surface élémentaire dS? d'une longueur élémentaire dl?|La charge d'un volume élémentaire est&nbsp;\\[dq = \\rho.dV\\]<br>La charge d'une surface élémentaire est&nbsp;\\[dq = \\sigma.dS\\]<br>La charge d'une longueur élémentaire est&nbsp;\\[dq = \\lambda.dl\\]|${PEM1}
10038|<span style="color: rgb(255, 170, 0);">(INC)</span><br>Quelle condition est nécessaire pour qu'une distribution de charges&nbsp;soit invariante par rotation autour d'un axe Δ ?|Il faut que pour tout point M appartenant à cette distribution, sa densité de charge vérifie ρ(M′) = ρ(M) (cas volumique) avec M′ l'image de M par rotation d'un angle quelconque autour de Δ.|${PEM1}
10039|<span style="color: rgb(255, 170, 0);">(INC)</span><br>Quelle condition est nécessaire pour qu'une distribution de charges illimitée dans la direction d'un axe Δ soit invariante par translation suivant Δ ?|Il faut que pour tout point M appartenant à cette distribution et son translaté M', sa densité de charge vérifie : ρ(M') = ρ(M) (cas volumique)|${PEM1}
10040|<span style="color: rgb(0, 255, 0);">(INC)</span><br>Quel choix de coordonnées est adapté à une invariance par translation ? Puis par rotation ?|•&nbsp;Invariances par translation → coordonnées cartésiennes ou cylindriques.<br>• Invariances par rotation → coordonnées cylindriques ou sphériques.|${PEM1}
10041|<span style="color: rgb(255, 170, 0);">(INC)</span><br>Que dire du champ électrostatique en un point P' symétrique de P par rapport à un plan d’antisymétrie<br>d’une distribution de charges ? (n’appartenant pas forcément à cette distribution de charges)|Le champ électrostatique en P' est l’opposé du symétrique de celui en P par rapport au<br>plan d’antisymétrie de la distribution de charges.|${PEM1}
10042|(INC)<br>Que dire du champ électrostatique en P', point symétrique de P par rapport à un plan de symétrie<br>d’une distribution de charges ?|Le champ électrostatique en P' est le symétrique de celui en P par rapport au plan de symétrie de la distribution de charge.|${PEM1}
10043|(INC)<br>Que dire du champ électrostatique d'un point M d'un plan de symétrie d’une distribution de charges ?&nbsp;|Le champ électrostatique créé en un point M d’un plan de symétrie d’une distribution de charges appartient à ce plan.|${PEM1}
10044|<span style="color: rgb(255, 170, 0);">(INC)</span><br>Que dire d'un champ&nbsp;\\(\\vec{E}\\) créé par une distribution volumique de charge ?&nbsp;&nbsp;(Domaine de définition et continuité?)|Le champ \\(\\vec{E}\\)&nbsp;créé par une distribution volumique de charge est défini et continu en tout point de l’espace.|${PEM1}
10045|<span style="color: rgb(255, 170, 0);">(INC)</span><br>Que dire d'un champ&nbsp;\\(\\vec{E}\\) créé par une distribution surfacique de charge ?&nbsp;&nbsp;(Domaine de définition et continuité?)|Le champ \\(\\vec{E}\\) créé par une distribution surfacique de charge est défini et continu en tout point de l’espace, sauf au niveau des points de la distribution. Il est donc discontinu à la traversée de la surface chargée.|${PEM1}
10046|(INC)<br>Que dire d'un champ \\(\\vec{E}\\) créé par un ensemble de charges ponctuelles ? (Domaine de définition et continuité?)|Le champ \\(\\vec{E}\\)&nbsp;créé par un ensemble de charges ponctuelles est défini et continu en tout point de<br>l’espace, sauf sur les charges.|${PEM1}
10047|<span style="color: rgb(0, 255, 0);">(INC)</span><br>Qu'est-ce qu'un plan de symétrie d'une distribution de charges ?|Un plan de symétrie d'une distribution de charges est un plan tel que la distribution de charges obtenue en déplaçant les charges selon une symétrie par rapport à ce plan est identique à la<br>distribution initiale.|${PEM1}
10048|<span style="color: rgb(0, 255, 0);">(INC)</span><br>Qu'est-ce qu'un plan d'antisymétrie d'une distribution de charges ?|On appelle plan d’antisymétrie d'une distribution de charges un plan tel que la distribution de charges obtenue en déplaçant les charges selon une symétrie par rapport à ce plan est opposée (changement de signe) à la distribution initiale.|${PEM1}
10049|<span style="color: rgb(255, 170, 0);">(INC)</span><br>Donner la loi de Coulomb qui s'exerce entre deux charges ponctuelles q1 et q2 séparées d'une distance r.|\\(\\vec{F}_{2 \\rightarrow 1} = - \\vec{F}_{1 \\rightarrow 2} = \\frac{1}{4 \\pi \\epsilon _0} \\frac{q_1 q_2}{r^2} \\vec{u}_{2 \\rightarrow 1}\\)|${PEM1}
10050|<span style="color: rgb(0, 255, 0);">(INC)</span><br>Comment est décrite la répartition de la charge d'une distribution volumique/ surfacique/ linéique de charges ?|Elle est décrite par une fonction scalaire appelée densité volumique/ surfacique/ linéique de charge&nbsp; \\(\\rho\\)/ \\(\\sigma\\)/\\(\\lambda\\), qui dépend des coordonnées (x', y', z') des points de la distribution de charges.|${PEM1}
10051|<span style="color: rgb(255, 170, 0);">(INC)</span><br>Comment calcule-t-on le champ électrique total en un point en utilisant le principe de superposition ?|Le champ électrique total en un point est calculé en faisant la somme vectorielle des champs électriques créés par chaque charge prise individuellement.|${PEM1}
10052|(INC)<br>Comment calcule-t-on la force totale exercée sur une charge de la part d'un ensemble de charges ponctuelles?|On utilise le théorème de superposition en sommant la contribution de chaque charge ponctuelle prise séparément.|${PEM1}
10053|<span style="color: rgb(0, 255, 0);">(INC)</span><br>Donner le champ électrostatique crée en un point P par une charge ponctuelle q située en S|\\(\\vec{E} (P) = \\frac{q}{4 \\pi \\epsilon _0} \\frac{\\vec{u}_r}{r^2} = \\frac{q}{4 \\pi \\epsilon _0}&nbsp;&nbsp;\\frac{\\vec{SP}}{SP^3}\\)|${PEM1}
10054|<span style="color: rgb(255, 170, 0);">(INC)</span><br>Donner la direction de \\(\\vec{E}\\) dans le cas où \\(q >0\\)|Le champ \\(\\vec{E}\\) créé par une charge ponctuelle positive part de la charge. Il diverge à partir de la charge<img src="images/paste-c1726407b90adfa409f559a158eb8b1a740d476c.jpg">|${PEM1}
10055|<span style="color: rgb(255, 170, 0);">(INC)</span><br>Donner la direction de \\(\\vec{E}\\) dans le cas où \\(q <0\\)|Le champ \\(\\vec{E}\\) créé par une charge ponctuelle négative se dirige vers la charge. Il converge vers la charge<img src="images/paste-001a83783b8dd4b04bb9bb0d44ca862c9303f523.jpg">|${PEM1}
10056|<span style="color: rgb(0, 255, 0);">(INC)</span><br>Deux charges \\(q_1, q_2\\) qui sont de signe différent interagissent entre elles. S'attirent-elles ou se repoussent-elles ? Pourquoi ?|Elles s'attirent. En effet, \\(q_1 q_2 < 0\\), donc la force d'interaction électrostatique est attractive.|${PEM1}
10057|<span style="color: rgb(0, 255, 0);">(INC)</span><br>Deux charges \\(q_1, q_2\\) qui sont de même signe interagissent entre elles. S'attirent-elles ou se repoussent-elles ? Pourquoi ?|Elles se repoussent. En effet, \\(q_1 q_2 > 0\\), donc la force d'interaction électrostatique est répulsive.|${PEM1}
10058|<span style="color: rgb(0, 255, 0);">(INC)</span><br>Comment s'appelle la constante \\(\\epsilon_0\\) dans la loi de Coulomb ?|C'est la permittivité du vide&nbsp;|${PEM1}
10059|<span style="color: rgb(0, 255, 0);">(INC)</span><br>Quand peut-on considérer une distribution de charges comme surfacique ?|Une distribution de charges peut être considérée comme surfacique lorsque l'une de ses dimensions spatiales est beaucoup plus petite que les deux autres dimensions.|${PEM1}
10060|<span style="color: rgb(0, 255, 0);">(INC)</span><br>Quand peut-on considérer une distribution de charges comme linéique ?|Une distribution de charges peut être considérée comme linéique lorsque deux de ses dimensions spatiales sont beaucoup plus petites que la troisième dimension.|${PEM1}
10061|<img src="images/paste-de3005b71b3b26e6cbfb7bc7e487288057e44965.jpg">|<img src="images/paste-4e5b864acd14971b75ee4cfa20de066c86177c58.jpg">|${PEM1}
10062|<img src="images/paste-036e005e8785d46a0d662e7e88fa5533bfe23c98.jpg">|<img src="images/paste-75d5efd4f249c0e30de16f6754802351a3a09811.jpg">|${PEM1}
10063|<span style="color: rgb(0, 255, 0);">(A.R)</span> Quelle est la définition de la circulation du champ électrostatique \\(\\vec E\\) de \\(A\\) à \\(B\\) le long de \\((\\Gamma)\\) ?<br>Dépend-elle du chemin suivi \\((\\Gamma)\\) pour aller de A à B?|\\[C_{A \\to B(\\Gamma)}=\\int_{A(\\Gamma)}^{B}{\\vec E \\cdot \\vec{dl} }\\]Cette circulation est indépendante du chemin suivi car elle peut s'écrire sous la forme de la variation d'une fonction qui est le potentiel électrostatique :<br>\\(C_{A \\to B}=\\int_{A}^{B}{\\vec E \\cdot \\vec{dl} }=-(V_B-V_A) = V_A - V_B\\)|${PEM2}
10064|<span style="color: rgb(0, 255, 0);">(A.R)</span> Que vaut la circulation du champ électrostatique le long d'un contour fermé? Justifier.|La <b>circulation</b> du champ électrostatique entre un point \\(A\\) et \\(B\\) est <i>indépendante du chemin parcouru</i>.<br>Si le chemin est fermé, B et A sont confondus donc \\(V_A=V_B\\) et la circulation du champ est <b>nulle</b> : \\[C_{A \\to A} = \\oint \\vec E \\cdot \\vec{dl} =-(V_A -V_A ) = 0\\]|${PEM2}
10065|<span style="color: rgb(255, 170, 0);">(A.R)</span> Quelle est la formule donnant le potentiel électrostatique créé en un point \\(P\\) par une charge source \\(q\\) ?|Potentiel électrostatique :<br>\\[V(P) = \\frac{1}{4\\pi \\varepsilon_0}\\frac{q}{r} + K\\]\\(r\\) : distance du point \\(P\\) par rapport à la charge source<br>\\(q\\) : charge source<br>K : une constante d'intégration (souvent choisie nulle à l'infini)|${PEM2}
10066|<span style="color: rgb(0, 255, 0);">(A.R)</span> Quelle est la forme des surfaces équipotentielles d'une charge ponctuelle ?|Ce sont des sphères dont le centre est la position de la charge ponctuelle.|${PEM2}
10067|<span style="color: rgb(255, 170, 0);">(A.R)</span> Comment évolue le potentiel électrostatique à mesure que l'on s'éloigne d'une charge ponctuelle ? Comment oriente-t-on les flèches du champ électrostatique sur un schéma ?|Selon le signe de \\(q\\):<br><ul><li>Si \\(q > 0\\), le potentiel <b>décroît</b> lorsque l'on s'éloigne de la charge.</li><li>Si \\(q < 0\\), le potentiel <b>croît</b> lorsque l'on s'éloigne de la charge.</li></ul><br>Le champ électrostatique est toujours orienté dans le sens des <b>potentiels décroissants</b>.|${PEM2}
10068|<span style="color: rgb(255, 170, 0);">(A.R)</span> Quelle formule donne le potentiel électrostatique créé par plusieurs charges ponctuelles en un point \\(P\\) ?|\\[V(P) = \\frac{1}{4 \\pi \\varepsilon_0}\\sum_i \\frac{q_i}{r_i}\\]<br>\\(q_i\\) : charge en Coulomb (C) de la \\(i\\)-ème particule<br>\\(r_i\\) : distance entre la \\(i\\)-ème particule et le point \\(P\\)<br><br>On choisit généralement la constante nulle, de sorte que \\(V \\to 0\\) lorsque \\(r_i \\to \\infty\\).|${PEM2}
10069|<span style="color: rgb(0, 255, 0);">(L.L)</span> Dans le repère orthonormé \\((O, \\vec{u}_x, \\vec{u}_y, \\vec{u}_z)\\), donnez \\(df\\), puis \\(\\vec{grad}f\\) et enfin la relation entre les deux.|Différentielle : \\[df = \\frac{\\partial f}{\\partial x}dx + \\frac{\\partial f}{\\partial y}dy + \\frac{\\partial f}{\\partial z}dz\\]<br>Gradient : \\[\\vec{grad}f=\\frac{\\partial f}{\\partial x}\\vec{u}_x + \\frac{\\partial f}{\\partial y}\\vec{u}_y + \\frac{\\partial f}{\\partial z}\\vec{u}_z\\]<br>Relation : \\(df=\\vec{grad}f \\cdot d\\vec{l}\\)|${PEM2}
10070|<span style="color: rgb(0, 255, 0);">(L.L)</span> \\(\\vec{grad}f\\) est normal à quelle surface ?|\\(\\vec{grad}f\\) est normal à la surface d'équation \\(f(x,y,z) = cste\\).|${PEM2}
10071|<span style="color: rgb(255, 170, 0);">(L.L)</span> Quelle est la relation intégrale liant le champ électrostatique et le potentiel électrostatique ?|\\[\\int_{A}^{B} \\vec{E} \\cdot d\\vec{l} = V_A - V_B\\]|${PEM2}
10072|<span style="color: rgb(255, 170, 0);">(L.L)</span> Quelle est la relation locale liant le champ électrostatique et le potentiel électrostatique ?|\\[\\vec{E} = -\\vec{grad} V\\]|${PEM2}
10073|<span style="color: rgb(255, 170, 0);">(L.L)</span> Comment retrouver la relation locale \\(\\vec{E} = -\\vec{grad}V\\) à l'aide de la relation intégrale associée ?|La relation intégrale \\(\\int_{A}^{B} \\vec{E} \\cdot d\\vec{l} = - (V_B - V_A)\\) est vraie pour un déplacement élémentaire \\(d\\vec{l}\\) : \\(\\vec{E} \\cdot d\\vec{l} = -dV\\).<br>Par définition du gradient, on a aussi \\(dV = \\vec{grad}V \\cdot d\\vec{l}\\).<br>En comparant les deux expressions, on obtient \\(\\vec{E} = -\\vec{grad}V\\).|${PEM2}
10074|<span style="color: rgb(255, 170, 0);">(C.J)</span> L'énergie potentielle électrostatique \\(E_p\\) d'une charge \\(q_0\\) placée dans un champ extérieur \\(\\vec{E}\\) (qui dérive d'un potentiel \\(V\\)) vérifie la relation :|\\[E_p = q_0V\\]|${PEM2}
10075|<span style="color: rgb(255, 170, 0);">(C.J)</span> Comment passer de la relation \\(\\vec{E} = -\\vec{grad}V\\) à la relation \\(\\vec{F} = -\\vec{grad}E_p\\) ?|On multiplie par la charge \\(q_0\\) :<br>\\(q_0\\vec{E} = -q_0\\vec{grad}V\\)<br>Comme \\(\\vec{F} = q_0\\vec{E}\\) et \\(E_p = q_0V\\), on obtient :<br>\\(\\vec{F} = -\\vec{grad}(E_p)\\)|${PEM2}
10076|<span style="color: rgb(0, 255, 0);">(C.J)</span> Quelle est l'unité du potentiel électrostatique ?|Le volt (V).|${PEM2}
10077|<span style="color: rgb(0, 255, 0);">(C.J)</span> Quelle est l'unité du champ \\(\\vec{E}\\) ?|Le volt par mètre (\\(V \\cdot m^{-1}\\)).|${PEM2}
10078|<span style="color: rgb(0, 255, 0);">(C.J)</span> Dans quel sens sont orientées les lignes du champ électrostatique ?|Dans le sens des potentiels décroissants.|${PEM2}
10079|<span style="color: rgb(0, 255, 0);">(C.J)</span> Comment sont orientées les lignes du champ électrostatique par rapport aux surfaces équipotentielles ?|Elles sont orthogonales (perpendiculaires) aux surfaces équipotentielles.|${PEM2}
10080|<span style="color: rgb(0, 255, 0);">(T.B.)</span> Quelles sont les 5 étapes pour appliquer le théorème de Gauss ?|1. <b>Invariances et Symétries</b> :<br>&nbsp;&nbsp;&nbsp;&nbsp;- Invariances → choix des coordonnées et variables dont dépend \\(|\\vec{E}|\\).<br>&nbsp;&nbsp;&nbsp;&nbsp;- Symétries → direction de \\(\\vec{E}\\).<br>2. <b>Choix de la surface de Gauss (Sg)</b> :<br>&nbsp;&nbsp;&nbsp;&nbsp;- Doit être fermée.<br>&nbsp;&nbsp;&nbsp;&nbsp;- Idéalement, \\(|\\vec{E}|\\) = cste sur une partie de Sg, et \\(\\vec{E} \\perp d\\vec{S}\\) sur le reste.<br>3. <b>Calcul du flux de \\(\\vec{E}\\)</b> à travers Sg.<br>4. <b>Calcul de la charge intérieure \\(Q_{int}\\)</b> à Sg.<br>5. <b>Application du théorème</b> : \\(\\Phi = Q_{int} / \\varepsilon_0\\).|${PE345}
10081|<span style="color: rgb(255, 170, 0);">Ylan</span><br>Soit une charge ponctuelle \\(q\\), et une surface fermée \\(S\\) (Sphère de rayon \\(R\\), centrée sur \\(q\\)).<br>Déterminer le flux du champ \\(\\vec{E}\\) créé par \\(q\\) à travers \\(S\\).|\\[\\vec{E}(M \\in S) = \\frac{q}{4\\pi\\varepsilon_0R^2}\\vec{u_r}\\]Le flux est donné par :<br>\\[\\phi = \\unicode{x222F}_{S} \\vec{E} \\cdot d\\vec{S} = \\unicode{x222F}_{S} \\frac{q}{4\\pi\\varepsilon_0R^2}\\vec{u_r} \\cdot (dS \\cdot \\vec{u_r})\\] \\[= \\frac{q}{4\\pi\\varepsilon_0R^2} \\iint_S dS = \\frac{q}{4\\pi\\varepsilon_0R^2} (4\\pi R^2) = \\frac{q}{\\varepsilon_0}\\]|${PE345}
10082|<span style="color: rgb(255, 170, 0);">Ylan</span><br>Établir l’expression du champ \\(\\vec{E}\\) créé en un point M par une distribution linéique de charge \\(\\lambda\\) uniforme sur un fil rectiligne infini.|1. <b>Invariances & Symétries</b> : \\(\\vec{E}(M) = E(r)\\vec{u_r}\\)<br>2. <b>Surface de Gauss</b> : Cylindre de rayon r et de hauteur h, fermé par deux disques.<br><img src="images/Capture d’écran 2023-11-12 172335.png"><br>3. <b>Calcul du flux</b> : \\(\\Phi = \\unicode{x222F}_{S_g} \\vec{E} \\cdot d\\vec{S} = E(r) \\cdot (2\\pi rh)\\)<br>4. <b>Charge intérieure</b> : \\(Q_{int} = \\lambda h\\)<br>5. <b>Th. de Gauss</b> : \\(E(r) \\cdot 2\\pi rh = \\frac{\\lambda h}{\\varepsilon_0}\\)<br><b>Résultat</b> : \\(\\vec{E}(M) = \\frac{\\lambda}{2\\pi r\\varepsilon_0} \\vec{u_r}\\|${PE345}
10083|<span style="color: rgb(255, 170, 0);">(Yuye)</span> Comment définir le vecteur surface élémentaire \\(d\\vec{S}_M\\) ?|\\(d\\vec{S}_M\\) est un vecteur <b>normal</b> (perpendiculaire) à la surface élémentaire \\(dS_M\\) au point M.<br><img src="images/IMG_20231115_205047.jpg"><br>Son orientation dépend du type de surface :<br>1. <b>Surface ouverte</b> : le sens est choisi arbitrairement (changer le sens change le signe du flux).<br>2. <b>Surface fermée</b> : \\(d\\vec{S}_M\\) est toujours orienté <b>vers l'extérieur</b>.|${PE345}
10084|<span style="color: rgb(255, 170, 0);">(Yuye)</span> Énoncer le théorème de Gauss pour une surface fermée quelconque.|Le flux du champ électrostatique \\(\\vec{E}\\) à travers une surface fermée \\(S_g\\) est égal à la charge totale \\(Q_{int}\\) contenue à l'intérieur de cette surface, divisée par la permittivité du vide \\(\\varepsilon_0\\) :<br>\\[\\Phi = \\unicode{x222F}_{S_g} \\vec{E}(M) \\cdot d\\vec{S}_M = \\frac{Q_{int}}{\\varepsilon_0}\\]|${PE345}
10085|<span style="color: rgb(255, 170, 0);">(Yuye)</span> Établir le champ créé par un cylindre infini de rayon \\(R\\), uniformément chargé en volume avec une densité \\(\\rho\\).|<img src="images/IMG_20231115_205047-9a9355bb58d3059ca8f62b4d7ffd956dab49ccab.jpg"><br>Par symétrie, \\(\\vec{E}(M) = E_r(r)\\vec{u_r}\\). On utilise une surface de Gauss cylindrique de rayon \\(r\\) et de hauteur \\(h\\).<br>Le flux vaut \\(\\Phi = E_r(r) \\cdot 2\\pi rh\\).<br><b>1er cas : \\(r < R\\)</b><br>\\(Q_{int} = \\rho (\\pi r^2 h)\\) \\(\\Rightarrow E_r(r) = \\frac{\\rho r}{2\\varepsilon_0}\\)<br><b>2ème cas : \\(r > R\\)</b><br>\\(Q_{int} = \\rho (\\pi R^2 h)\\) \\(\\Rightarrow E_r(r) = \\frac{\\rho R^2}{2\\varepsilon_0 r}\\)<br><b>Graphe de \\(E_r(r)\\) :</b><br><img src="images/IMG_20231115_221031.jpg">|${PE345}
10086|<span style="color: rgb(255, 170, 0);">(Arthur)</span> Quel est le champ électrostatique à l'extérieur d'un condensateur plan idéal ?|Il est nul : \\(\\vec{E} = \\vec{0}\\).|${PE345}
10087|<span style="color: rgb(255, 170, 0);">(Manuel)</span> Quelle est la norme du champ électrostatique entre les deux armatures d'un condensateur plan idéal ?|\\[|\\vec{E}| = \\frac{\\sigma}{\\varepsilon_0} = \\frac{Q}{S\\varepsilon_0}\\]Avec :<br>• \\(\\sigma\\) la valeur absolue de la densité surfacique de charge des armatures.<br>• \\(Q\\) la valeur absolue de leur charge et \\(S\\) leur surface.<br>• \\(\\varepsilon_0\\) la permittivité du vide.|${PE345}
10088|<span style="color: rgb(0, 255, 0);">Victor</span> Déterminer le champ électrostatique créé par un plan infini, de densité surfacique de charge \\(\\sigma\\) uniforme.<br><img src="images/plan-b84c87801652a62f616c58fbe3773f90809cb387.png">|Par symétrie, \\(\\vec{E}(M) = E_z(z)\\vec{u_z}\\).<br>On utilise une surface de Gauss en forme de cylindre (ou pavé) traversant le plan.<br><img src="images/plan-e73174d5f9184eeeafc3dd30474a2ce6087c52f2.png"><br>Le flux ne traverse que les bases (surface \\(A\\)) : \\(\\Phi = 2 \\cdot E_z(z) \\cdot A\\).<br>La charge intérieure est \\(Q_{int} = \\sigma A\\).<br>Le théorème de Gauss donne \\(2 E_z(z) A = \\frac{\\sigma A}{\\varepsilon_0}\\), soit \\(E_z(z) = \\frac{\\sigma}{2\\varepsilon_0}\\).<br>Finalement :<br>• Pour \\(z > 0\\) : \\(\\vec{E}(M) = \\frac{\\sigma}{2\\varepsilon_0} \\vec{u_z}\\)<br>• Pour \\(z < 0\\) : \\(\\vec{E}(M) = -\\frac{\\sigma}{2\\varepsilon_0} \\vec{u_z}\\)|${PE345}
10089|<span style="color: rgb(255, 170, 0);">(Ilyass)</span> On considère un condensateur cylindrique. Montrer que le champ électrostatique en tout point est de la forme \\(\\vec{E}(M) = E(r)\\vec{u_r}\\).|1. <b>Invariance par rotation</b> autour de l'axe Oz.<br>2. <b>Invariance par translation</b> le long de l'axe Oz (si le condensateur est considéré comme infini).<br>Ces invariances impliquent que la norme de \\(\\vec{E}\\) ne dépend que de la distance radiale \\(r\\) : \\(|\\vec{E}| = E(r)\\).<br>3. <b>Symétrie</b> : Tout plan contenant l'axe Oz est un plan de symétrie, donc \\(\\vec{E}\\) est radial.<br><b>Bilan :</b> \\(\\vec{E}(M) = E(r)\\vec{u_r}\\).|${PE345}
10090|<span style="color: rgb(255, 170, 0);">Victor</span> Déterminer le champ \\(\\vec{E}(M)\\) créé par un condensateur plan idéal.<br><img src="images/Capture d’écran 2023-11-16 225353.jpg">|On utilise le <b>théorème de superposition</b> : \\(\\vec{E}(M) = \\vec{E}_{haut}(M) + \\vec{E}_{bas}(M)\\).<br>Le champ d'un plan infini est \\(|\\vec{E}_{plan}| = \\frac{|\\sigma|}{2\\varepsilon_0}\\).<br>• <b>Entre les armatures (0 < z < e) :</b> Les deux champs s'additionnent :<br>\\(\\vec{E}(M) = -\\frac{\\sigma}{2\\varepsilon_0}\\vec{u_z} - \\frac{\\sigma}{2\\varepsilon_0}\\vec{u_z} = -\\frac{\\sigma}{\\varepsilon_0}\\vec{u_z}\\)<br>• <b>À l'extérieur (z > e ou z < 0) :</b> Les deux champs se compensent :<br>\\(\\vec{E}(M) = \\vec{0}\\)|${PE345}
10091|<span style="color: rgb(255, 170, 0);">Victor</span> Déterminer le potentiel électrostatique \\(V(M)\\) pour un condensateur plan idéal, avec \\(V=0\\) sur l'armature à \\(z=0\\).<br><img src="images/Capture d’écran 2023-11-16 225353.jpg">|On utilise \\(\\vec{E} = -\\vec{grad}(V)\\). Comme \\(\\vec{E}\\) ne dépend que de z, \\(V\\) ne dépend que de z et \\(E_z = -\\frac{dV}{dz}\\).<br>• <b>Pour \\(z < 0\\)</b> : \\(E_z=0 \\Rightarrow V(z) = C_1\\). Comme \\(V(0)=0\\), alors \\(C_1=0\\). \\(V=0\\).<br>• <b>Pour \\(0 < z < e\\)</b> : \\(E_z=-\\frac{\\sigma}{\\varepsilon_0} \\Rightarrow \\frac{dV}{dz} = \\frac{\\sigma}{\\varepsilon_0}\\). En intégrant, \\(V(z) = \\frac{\\sigma}{\\varepsilon_0}z + C_2\\). Avec \\(V(0)=0\\), on a \\(C_2=0\\). Soit \\(V(z) = \\frac{\\sigma}{\\varepsilon_0}z\\).<br>• <b>Pour \\(z > e\\)</b> : \\(E_z=0 \\Rightarrow V(z) = C_3\\). Par continuité en \\(z=e\\), \\(C_3 = V(e) = \\frac{\\sigma e}{\\varepsilon_0}\\).<br><b>Bilan :</b> \\(V(z) = 0\\) si \\(z<0\\), \\(\\frac{\\sigma z}{\\varepsilon_0}\\) si \\(0<z<e\\), et \\(\\frac{\\sigma e}{\\varepsilon_0}\\) si \\(z>e\\).|${PE345}
10092|<span style="color: rgb(0, 255, 0);">(Océane)</span> Cette figure représente les lignes équipotentielles. Donner l'allure des lignes de champ.<br><img src="images/im3.jpg">|<img src="images/im1.jpg">|${PE345}
10093|<span style="color: rgb(255, 170, 0);">(Daouda)</span> Dans un tube de champ vide de charge, démontrer l'égalité \\(E_1 S_1 = E_2 S_2\\). En déduire que là où les lignes de champ se resserrent, le champ est plus intense.|<img src="images/paste-c8c9585695c583cd76823e76b283fed4d0b34b2c.jpg"><br>On applique le théorème de Gauss à la surface fermée du tube. Le flux à travers la surface latérale est nul. Le flux total est \\(\\Phi = -E_1 S_1 + E_2 S_2\\).<br>Comme il n'y a pas de charge à l'intérieur (\\(Q_{int}=0\\)), le flux total est nul.<br>Donc \\(-E_1 S_1 + E_2 S_2 = 0 \\Rightarrow E_1 S_1 = E_2 S_2\\).<br>Cette relation de conservation du flux montre que si la section \\(S\\) diminue (les lignes se resserrent), le champ \\(E\\) doit augmenter.|${PE345}
10094|<span style="color: rgb(255, 170, 0);">(Vincent)</span> Tableau des analogies entre gravitation et électrostatique.|<img src="images/paste-8274af54e4ef8158c9147e47a8c1d6073f3a1f0a.jpg">|${PE345}
10095|<span style="color: rgb(255, 170, 0);">V.Iulian</span><br>Calculer la circulation de \\(\\vec{B}\\) le long du contour (E,F,G,H) pour un solénoïde infini.<br><img src="images/img7045909058837530815.jpg">|La circulation est \\(\\oint \\vec{B}\\cdot d\\vec{l} = \\int_E^F + \\int_F^G + \\int_G^H + \\int_H^E\\).<br>• \\(\\int_F^G \\vec{B}\\cdot d\\vec{l} = 0\\) et \\(\\int_H^E \\vec{B}\\cdot d\\vec{l} = 0\\) car \\(\\vec{B} \\perp d\\vec{l}\\).<br>• \\(\\int_G^H \\vec{B}\\cdot d\\vec{l} = 0\\) car \\(\\vec{B} = \\vec{0}\\) à l'extérieur.<br>• Il ne reste que le segment (E,F) :<br>\\(\\oint \\vec{B}\\cdot d\\vec{l} = \\int_E^F B(r) \\vec{u_z} \\cdot (dz \\vec{u_z}) = B(r) \\cdot h\\)<br>En appliquant le théorème d'Ampère (voir image), on trouve le champ à l'intérieur du solénoïde.<br><img src="images/paste-e349a260a12b99bdc732b3868f7f557cb6dda0ea.jpg">|${PEM6}
10096|<span style="color: rgb(255, 170, 0);">V.Iulian</span><br>Pour deux spires identiques parcourues par le même courant (bobines de Helmholtz), répondre aux questions.<br><img src="images/img2498669175369567868.jpg">|1) <b>Allure des lignes de champ :</b><br><img src="images/paste-ee06f45381f644b5348501214aa8bf553c0ae70b.jpg"><br>2) <b>Symétrie (même sens de courant) :</b> Le plan médian est un plan de <b>symétrie</b> pour les courants, donc un plan d'<b>antisymétrie</b> pour \\(\\vec{B}\\). Les lignes de champ coupent ce plan orthogonalement.<br>3) <b>Intérêt :</b> Obtenir une zone où le champ magnétique est quasi <b>uniforme</b>.<br>4) <b>Symétrie (sens opposés) :</b> Le plan médian devient un plan d'<b>antisymétrie</b> pour les courants, donc un plan de <b>symétrie</b> pour \\(\\vec{B}\\). Les lignes de champ sont contenues dans ce plan.<br><img src="images/paste-911334ecc07bc5a2c3f229921025f3087e0a090f.jpg">|${PEM6}
10097|<span style="color: rgb(255, 170, 0);">(A.P)</span> Analyser la carte de champ magnétique de deux fils parallèles.<br><img src="images/20231127_205031.jpg">|1) <b>Lignes de champ :</b> Ce sont des cercles concentriques autour des fils.<br>2) <b>Position des fils :</b> Au centre des plus petits cercles.<br>3) <b>Intensité :</b> Le champ est le plus intense là où les lignes sont les plus resserrées (entre les deux fils).<br>4) <b>Signe des courants :</b> Le plan médian est un plan de symétrie pour \\(\\vec{B}\\) (les lignes y sont contenues), donc un plan d'antisymétrie pour les courants. Les courants sont donc de <b>signes opposés</b>.<br>5) <b>Autre possibilité :</b> Inverser les deux courants ET le sens des lignes de champ.<br>6) <b>Cas de courants de même signe :</b><br><img src="images/paste-8c5f8f95d90ce3a0ee2536285b9588e66db63e68.jpg">|${PEM6}
10098|<span style="color: #cccc00;">(M.W)</span> Commenter les symétries pour une distribution de courant et le champ magnétique \\(\\vec{B}\\) qu'elle crée.|Les règles de symétrie sont inversées entre les courants (causes) et le champ \\(\\vec{B}\\) (effet) :<br>• Un <b>plan de symétrie</b> des courants est un <b>plan d'antisymétrie</b> pour \\(\\vec{B}\\). En un point M de ce plan, \\(\\vec{B}\\) est <b>orthogonal</b> au plan.<br>• Un <b>plan d'antisymétrie</b> des courants est un <b>plan de symétrie</b> pour \\(\\vec{B}\\). En un point M de ce plan, \\(\\vec{B}\\) est <b>contenu</b> dans le plan.|${PEM6}
10099|<span style="color: #cccc00;">(M.W)</span> Interpréter le cas où les lignes d'un champ magnétique se resserrent.|Là où les lignes de champ se resserrent, le champ magnétique est plus intense.|${PEM6}
10100|<span style="color: rgb(255, 170, 0);">(BM)</span> Donner l'expression de la circulation du champ \\(\\vec{B}\\) le long d'un contour fermé \\(\\Gamma\\).|La circulation C est l'intégrale curviligne de \\(\\vec{B}\\) le long du contour fermé \\(\\Gamma\\) :<br>\\[C = \\oint_{\\Gamma}\\vec{B}\\cdot d\\vec{l}\\]|${PEM6}
10101|<span style="color: rgb(255, 170, 0);">(BM)</span> Énoncé du théorème d'Ampère.|La circulation du champ magnétique \\(\\vec{B}\\) le long d'un <b>contour fermé et orienté</b> \\(\\Gamma\\) (contour d'Ampère) est égale au produit de \\(\\mu_0\\) par l'intensité algébrique totale \\(I_{enlacée}\\) qui traverse n'importe quelle surface s'appuyant sur ce contour.<br>\\[\\oint_{\\Gamma}\\vec{B}\\cdot d\\vec{l} = \\mu_0 I_{enlacée}\\]|${PEM6}
10102|<span style="color: rgb(255, 170, 0);">(BM)</span> Quelle est l'expression de l'intensité enlacée pour une distribution <b>volumique</b> de courant ?|Elle est donnée par le flux du vecteur densité de courant \\(\\vec{j}\\) à travers une surface S s'appuyant sur le contour \\(\\Gamma\\).<br>\\[I_{enlacée} = \\iint_{S}\\vec{j}\\cdot d\\vec{S}\\]L'orientation de \\(d\\vec{S}\\) est liée à celle du contour \\(\\Gamma\\) par la règle de la main droite.|${PEM6}
10103|<span style="color: rgb(255, 170, 0);">(BM)</span> Quelle est l'expression de l'intensité enlacée pour des courants <b>filiformes</b> ?|C'est la somme algébrique des intensités \\(I_k\\) des courants qui traversent le contour.<br>\\[I_{enlacée} = \\sum_{k} \\epsilon_k I_k\\]où \\(\\epsilon_k = +1\\) si le courant traverse la surface dans le même sens que la normale \\(\\vec{n}\\) (définie par la main droite), et \\(\\epsilon_k = -1\\) sinon.|${PEM6}
10104|<span style="color: rgb(255, 170, 0);">(BM)</span> Étapes de la méthode de calcul de \\(\\vec{B}(M)\\) par le théorème d'Ampère.|1. Étude des <b>invariances et symétries</b> de \\(\\vec{B}\\) pour déterminer sa direction et ses dépendances.<br>2. Choix d'un <b>contour d'Ampère</b> \\(\\Gamma\\) adapté : une ligne de champ où \\(|\\vec{B}|\\) est constant.<br>3. Si nécessaire, compléter \\(\\Gamma\\) avec des segments où \\(\\vec{B} \\perp d\\vec{l}\\) ou \\(\\vec{B} = \\vec{0}\\).<br>4. <b>Orienter</b> le contour sur le schéma.<br>5. Calculer la <b>circulation</b> \\(\\oint \\vec{B} \\cdot d\\vec{l}\\).<br>6. Calculer l'<b>intensité enlacée</b> \\(I_{enlacée}\\).<br>7. Appliquer le théorème pour trouver \\(\\vec{B}\\).|${PEM6}
10105|<span style="color: rgb(255, 170, 0);">(BM)</span> Que vaut le flux du champ magnétique à travers une surface <b>fermée</b> ?|Il est toujours <b>nul</b>. C'est une des équations de Maxwell.<br>\\[\\Phi = \\unicode{x222F}_{S_{fermée}} \\vec{B} \\cdot d\\vec{S} = 0\\]On dit que le champ \\(\\vec{B}\\) est à flux conservatif.|${PEM6}
10106|<span style="color: rgb(255, 170, 0);">(BM)</span> Ordre de grandeur du champ magnétique terrestre.|Environ \\(5 \\times 10^{-5} \\; T\\) (ou 50 µT).|${PEM6}
10107|<span style="color: rgb(255, 170, 0);">(BM)</span> Ordre de grandeur du champ à 1 cm d’un fil rectiligne parcouru par 10 A.|Environ \\(2 \\times 10^{-4} \\; T\\) (ou 200 µT).|${PEM6}
10108|<span style="color: rgb(0, 255, 0);">(BM)</span> Ordre de grandeur du champ à 1 mm d’un aimant permanent au néodyme.|De 0,1 T à 1 T.|${PEM6}
10109|<span style="color: rgb(0, 255, 0);">(BM)</span> Ordre de grandeur du champ magnétique d'un électroaimant de laboratoire.|De 1 T à 10 T (voire plus pour les électroaimants supraconducteurs).|${PEM6}
10110|<span style="color: rgb(255, 170, 0);">(S.E)</span> Appliquer le théorème d'Ampère pour un fil infini.<br><img src="images/paste-214e83666ae763236aea7c77a43581a64232fe68.jpg">|<img src="images/paste-7edb2b9f50f23eac4176399c3ea5d9a799a4afd8.jpg">|${PEM6}
10111|<span style="color: rgb(255, 170, 0);">(S.E)</span> Appliquer le théorème d'Ampère pour un solénoïde infini.<br><img src="images/paste-fa84d71882fccd01306a9563169c424e60dbdf56.jpg">|<img src="images/paste-ed68266b1711dc9559d0ae00bb0133c98c544ddd.jpg">|${PEM6}
10112|<span style="color: rgb(0, 255, 0);">(M.B.T.)</span> Exprimer la formule du moment magnétique d'un circuit filiforme plan, parcouru par un courant d'intensité \\(I\\). Préciser les termes et l'unité.|Le moment magnétique \\(\\vec{\\mathcal{M}}\\) est défini par :<br>\\[\\vec{\\mathcal{M}} = I\\vec{S} = IS\\vec{n}\\]où :<br>• \\(I\\) est l'intensité du courant.<br>• \\(S\\) est l'aire de la surface délimitée par la boucle de courant.<br>• \\(\\vec{n}\\) est le vecteur unitaire normal à la surface, orienté selon la règle de la main droite.<br><img src="images/IMG_825B15755F55-1.jpeg" width="433"><br>L'unité du moment magnétique est l'<b>ampère-mètre carré</b> (\\(A \\cdot m^2\\)).|${PEM8}
10113|<span style="color: rgb(0, 255, 0);">(M.B.T)</span> Dans quelles conditions peut-on parler d'un dipôle magnétique pour une source de champ magnétique ?|Une source de champ magnétique est un <u>dipôle magnétique</u> si :<br>1. Elle peut être modélisée par une boucle de courant de moment magnétique non nul \\(\\vec{\\mathcal{M}}\\).<br>2. On observe le champ à une distance \\(r\\) très grande devant la taille caractéristique \\(a\\) de la source (<b>approximation dipolaire</b> : \\(r \\gg a\\)).|${PEM8}
10114|<span style="color: rgb(0, 255, 0);">(A.R.)</span> Représenter les lignes de champ d'un dipôle magnétique.|Les lignes de champ d'un dipôle magnétique ressemblent à celles d'un petit aimant droit.<br><img src="images/cartechamps-1.png">|${PEM8}
10115|<span style="color: rgb(255, 170, 0);">(A.R)</span> Décrire qualitativement l'action d'un champ magnétique extérieur sur un dipôle magnétique.|• <b>Champ magnétique uniforme :</b> Le dipôle subit un couple qui tend à l'<b>orienter</b> parallèlement aux lignes de champ (comme l'aiguille d'une boussole). La force résultante est nulle.<br>• <b>Champ magnétique non uniforme :</b> Le dipôle subit un couple d'orientation ET une force nette qui l'<b>attire</b> vers les zones de champ magnétique <b>intense</b>.|${PEM8}
10116|Quelle est l'expression de l'énergie potentielle d'un dipôle de moment magnétique \\(\\vec{m}\\) placé dans un champ magnétique extérieur \\(\\vec{B}_{ext}\\) ?|L'énergie potentielle d'interaction est :<br>\\[E_p = -\\vec{m} \\cdot \\vec{B}_{ext}\\]Cette énergie est minimale (position stable) lorsque \\(\\vec{m}\\) est aligné avec \\(\\vec{B}_{ext}\\).|${PEM8}
10117|Si l'on assimile la Terre à un dipôle magnétique situé en son centre, quelle est l'orientation de son moment magnétique ? Et celle des lignes de champ aux pôles ?|Le moment magnétique terrestre \\(\\vec{m}_T\\) est dirigé approximativement du pôle <b>Nord géographique</b> vers le pôle <b>Sud géographique</b>.<br>Par conséquent, les lignes de champ magnétique terrestre "sortent" du pôle Sud géographique pour "entrer" au pôle Nord géographique (car le pôle Nord géographique est un pôle sud magnétique).|${PEM8}
10118|<span style="color: rgb(255, 170, 0);">Ylan</span> Qu'est-ce qu'un doublet de charges ?|Un doublet de charges est un ensemble de deux charges opposées, \\(+q\\) en un point P et \\(-q\\) en un point N, séparées par une distance \\(a = PN\\).<br>Il est caractérisé par son <b>moment dipolaire</b> : \\(\\vec{p}=q\\overrightarrow{NP}\\).|${PEM9}
10119|<span style="color: rgb(255, 170, 0);">Ylan</span> Définition du moment dipolaire et unité ?|Le moment dipolaire \\(\\vec{p}\\) d'une distribution de charges est défini par \\(\\vec{p} = q\\overrightarrow{NP}\\), où :<br>• N est le barycentre des charges négatives.<br>• P est le barycentre des charges positives.<br>• \\(q\\) est la somme des charges positives.<br>Ce vecteur est dirigé de la charge négative vers la positive. Son unité est le <b>Coulomb-mètre (C·m)</b> ou le <b>Debye (D)</b>.|${PEM9}
10120|<span style="color: rgb(255, 170, 0);">Ylan</span> Quel est le cadre de l'approximation dipolaire ?|<img src="images/Capture d'écran 2024-01-01 182539.png"><br>L'approximation dipolaire consiste à étudier les propriétés d'un dipôle électrostatique "loin" de celui-ci, c'est-à-dire à une distance \\(r = OM\\) très grande devant la taille \\(a\\) du dipôle : \\(r \\gg a\\).|${PEM9}
10121|<span style="color: rgb(255, 170, 0);">Victor</span> Quelle est l'énergie potentielle \\(E_p\\) d'un dipôle électrique <u>rigide</u> de moment dipolaire \\(\\vec{p}\\), placé dans un champ extérieur \\(\\vec{E}_{ext}\\) ?|L'énergie potentielle d'interaction est : \\(E_p = -\\vec{p} \\cdot \\vec{E}_{ext}\\)|${PEM9}
10122|<span style="color: rgb(0, 255, 0);">Ylan</span> Le potentiel et le champ électrostatique décroissent-ils plus ou moins vite avec la distance pour un dipôle que pour une charge ponctuelle ?|Pour les deux, la décroissance est <b>plus rapide</b> pour un dipôle :<br>• <b>Potentiel (V) :</b> varie en \\(1/r^2\\) pour un dipôle, contre \\(1/r\\) pour une charge ponctuelle.<br>• <b>Champ (E) :</b> varie en \\(1/r^3\\) pour un dipôle, contre \\(1/r^2\\) pour une charge ponctuelle.|${PEM9}
10123|<span style="color: rgb(255, 170, 0);">Ylan</span> Retrouver l'expression du potentiel créé par un dipôle (doublet de charges).|\(V(M) = V_P(M) + V_N(M) = \\frac{q}{4\\pi\\epsilon_0}(\\frac{1}{PM} - \\frac{1}{NM})\\)<br>Dans l'approximation dipolaire (\\(r \\gg a\\)), on effectue un développement limité de \\(1/PM\\) et \\(1/NM\\) :<br>\\(\\frac{1}{PM} \\approx \\frac{1}{r}(1 + \\frac{a}{2r}\\cos\\theta)\\) et \\(\\frac{1}{NM} \\approx \\frac{1}{r}(1 - \\frac{a}{2r}\\cos\\theta)\\)<br>En injectant ces expressions, on obtient :<br>\\[V(M) = \\frac{qa\\cos\\theta}{4\\pi\\epsilon_0 r^2} = \\frac{p\\cos\\theta}{4\\pi\\epsilon_0 r^2}\\]où \\(p = qa\\).<br>Avec la notation vectorielle : \\(V(M) = \\frac{\\vec{p} \\cdot \\vec{u_r}}{4\\pi\\epsilon_0 r^2}\\).<br><img src="images/Capture d'écran 2024-01-01 182539.png">|${PEM9}
10124|<span style="color: rgb(0, 255, 0);">Victor</span> Qu'est-ce qu'un dipôle électrostatique <u>rigide</u> ?|C'est un dipôle dont la norme de son moment dipolaire \\(|\\vec{p}|\\) est constante. La distance entre les charges ne varie pas.|${PEM9}
10125|<span style="color: rgb(255, 170, 0);">Victor</span> Que vaut la résultante des forces subies par un dipôle dans un champ électrostatique extérieur \\(\\vec{E}_{ext}\\) <b>uniforme</b> ?|La résultante des forces est <b>nulle</b>. Le dipôle ne subit qu'un couple qui tend à l'orienter.|${PEM9}
10126|<span style="color: rgb(255, 170, 0);">Ylan</span> Établir le champ électrostatique créé par un dipôle, connaissant son potentiel \\(V(M) = \\frac{p\\cos\\theta}{4\\pi\\epsilon_0 r^2}\\).|On utilise la relation \\(\\vec{E} = -\\vec{grad}(V)\\). En coordonnées sphériques :<br>\\(E_r = -\\frac{\\partial V}{\\partial r} = \\frac{2p\\cos\\theta}{4\\pi\\epsilon_0 r^3}\\)<br>\\(E_\\theta = -\\frac{1}{r}\\frac{\\partial V}{\\partial \\theta} = \\frac{p\\sin\\theta}{4\\pi\\epsilon_0 r^3}\\)<br>\\(E_\\varphi = 0\\)<br>Le champ total est : \\(\\vec{E} = \\frac{p}{4\\pi\\epsilon_0 r^3} (2\\cos\\theta \\vec{u_r} + \\sin\\theta \\vec{u_\\theta})\\)|${PEM9}
10127|<span style="color: rgb(255, 170, 0);">Victor</span> Comment agit un champ électrostatique extérieur <b>uniforme</b> sur un dipôle électrostatique ?|Le dipôle subit un couple qui tend à l'<b>orienter</b> parallèlement aux lignes de champ de \\(\\vec{E}_{ext}\\). Il n'y a pas de déplacement net.|${PEM9}
10128|<span style="color: rgb(0, 255, 0);">Ylan</span> Représenter les lignes de champ et les courbes équipotentielles du champ créé par un dipôle électrostatique.|<div style="text-align: center;"><img src="images/paste-f94a6b6040693dd84af9aa136b7c19529ad0bf87.jpg"></div><div style="text-align: center;">Les courbes non orientées sont les équipotentielles.<br>Les courbes orientées sont les lignes de champ (du + vers le -).</div>|${PEM9}
10129|<span style="color: rgb(0, 255, 0);">(Yuye)</span> Qu'est-ce qu'un moment dipolaire moléculaire ?|Bien que globalement neutres, certaines molécules (dites "polaires") sont dissymétriques. Le barycentre de leurs charges positives n'est pas confondu avec celui de leurs charges négatives. Cette séparation permanente des charges crée un <b>moment dipolaire permanent</b>.<br><img src="images/0.png">|${PEM9}
10130|<span style="color: rgb(255, 170, 0);">Victor</span> Comment agit un champ électrostatique <b>non uniforme</b> sur un dipôle électrostatique ?|Le dipôle subit deux effets :<br>1. <b>Effet d'orientation :</b> Un couple qui tend à l'aligner avec le champ \\(\\vec{E}_{ext}\\).<br>2. <b>Effet de déplacement :</b> Une force nette qui l'attire vers les zones où le champ \\(\\vec{E}_{ext}\\) est le plus <b>intense</b>.|${PEM9}
10131|<span style="color: rgb(255, 170, 0);">(Yuye)</span> Quelle est la force exercée par un ion \\(Na^+\\) sur une molécule d'eau (dipôle) située à une distance z ?|L'ion \\(Na^+\\) crée un champ \\(\\vec{E}_{ext} = \\frac{e}{4\\pi\\epsilon_0 z^2}\\vec{u_z}\\).<br>1. <b>Orientation :</b> Le dipôle de la molécule d'eau s'oriente selon \\(\\vec{u_z}\\) (\\(\\vec{p} = p\\vec{u_z}\\)).<br>2. <b>Force :</b> La force subie par le dipôle dans ce champ non uniforme est \\(\\vec{F} = \\vec{grad}(\\vec{p} \\cdot \\vec{E}_{ext}) = p \\frac{dE_{ext}}{dz}\\vec{u_z}\\).<br>\\[\\vec{F} = -\\frac{2pe}{4\\pi\\epsilon_0 z^3}\\vec{u_z}\\]La force est attractive : la molécule d'eau est attirée par l'ion.<br><img src="images/0-067d29de6397b7932ac10e579ca73727b1f13e21.png">|${PEM9}
10132|<span style="color: rgb(0, 255, 0);">(Yuye)</span> Qu'est-ce qu'un dipôle induit ?|Lorsqu'un atome ou une molécule (même non polaire) est placé dans un champ électrique extérieur, les charges positives et négatives sont déplacées en sens opposés. Cette séparation des barycentres des charges crée un <b>moment dipolaire "induit"</b>, qui n'existe qu'en présence du champ.|${PEM9}
10133|Établir l'expression du moment résultant \\(\\vec{\\Gamma}\\) (couple) subi par un doublet de charges dans un champ \\(\\vec{E}_{ext}\\) uniforme.|\\[\\vec{\\Gamma} = \\vec{M}_O(\\vec{F}_P) + \\vec{M}_O(\\vec{F}_N)\\]\\[= \\vec{OP} \\wedge (q\\vec{E}_{ext}) + \\vec{ON} \\wedge (-q\\vec{E}_{ext})\\]\\[= q(\\vec{OP} - \\vec{ON}) \\wedge \\vec{E}_{ext}\\]\\[= q\\overrightarrow{NP} \\wedge \\vec{E}_{ext}\\]\\[\\vec{\\Gamma} = \\vec{p} \\wedge \\vec{E}_{ext}\\]|${PEM9}
10134|<span style="color: rgb(0, 255, 0);">(Daouda Cisse)</span> Quelle est la forme générale (locale) des équations de Maxwell ?|Les quatre équations de Maxwell sont :<br><img src="images/e1.PNG">|${PEM10}
10135|<span style="color: rgb(0, 255, 0);">(Daouda Cisse)</span> Rappeler l'expression, dans le cas général, de l'équation de conservation de la charge.|L'équation locale de conservation de la charge électrique s'écrit :<br><img src="images/e2.PNG">|${PEM10}
10136|<span style="color: rgb(0, 255, 0);">(Daouda Cisse)</span> Démontrer, dans le cas unidimensionnel, l'équation de conservation de la charge.<br><img src="images/e3.PNG">|<img src="images/e4.PNG"><br><img src="images/e5.PNG"><br>On obtient finalement :<br><img src="images/e6.PNG">|${PEM10}
10137|<span style="color: rgb(0, 255, 0);">(Oceane Arabi)</span> Quelle est la relation entre la permittivité diélectrique du vide (\\(\\varepsilon_0\\)), la perméabilité magnétique du vide (\\(\\mu_0\\)) et la célérité de la lumière (c) ?|Ces trois constantes fondamentales sont liées par la relation :<br><img src="images/e7.PNG">|${PEM10}
10138|<span style="color: rgb(255, 170, 0);">(Daouda Cisse)</span> Quelle est la forme intégrale de l'équation de Maxwell-Gauss ?|C'est le <b>théorème de Gauss</b> pour le champ électrique : le flux de \\(\\vec{E}\\) à travers une surface fermée \\(S_g\\) est proportionnel à la charge \\(Q_{int}\\) qu'elle contient.<br>\\[\\Phi_E = \\unicode{x222F}_{S_g} \\vec{E} \\cdot d\\vec{S} = \\frac{Q_{int}}{\\varepsilon_0}\\]|${PEM10}
10139|<span style="color: rgb(255, 170, 0);">(Marion Vincent)</span> Quelle est la relation intégrale associée à l'équation de Maxwell-Flux ?|C'est la conservation du flux magnétique : le flux du champ \\(\\vec{B}\\) à travers <b>toute surface fermée</b> est nul.<br>\\[\\unicode{x222F}_{S_{fermée}} \\vec{B} \\cdot d\\vec{S} = 0\\]<br><img src="images/e9.PNG">|${PEM10}
10140|<span style="color: rgb(255, 170, 0);">(Marion Vincent)</span> Quelle est la relation intégrale de l'équation de Maxwell-Faraday ?|C'est la <b>loi de Faraday</b> sur l'induction : la circulation de \\(\\vec{E}\\) le long d'un contour fermé \\(\\Gamma\\) est égale à l'opposé de la dérivée temporelle du flux magnétique \\(\\Phi_B\\) à travers une surface s'appuyant sur ce contour.<br>\\[\\oint_{\\Gamma} \\vec{E} \\cdot d\\vec{l} = -\\frac{d\\Phi_B}{dt}\\]|${PEM10}
10141|<span style="color: rgb(255, 170, 0);">(Oceane Arabi)</span> Quelle est la relation intégrale de l'équation de Maxwell-Ampère ?|C'est le <b>théorème d'Ampère généralisé</b> : la circulation de \\(\\vec{B}\\) le long d'un contour fermé \\(\\Gamma\\) est égale à la somme du courant enlacé et du courant de déplacement.<br>\\[\\oint_{\\Gamma} \\vec{B} \\cdot d\\vec{l} = \\mu_0 I_{enlacé} + \\varepsilon_0 \\mu_0 \\frac{d}{dt} \\iint_{S} \\vec{E} \\cdot d\\vec{S}\\]|${PEM10}
10142|<span style="color: rgb(0, 255, 0);">(Oceane Arabi)</span> Dans une région vide de charge (\\(\\rho=0\\)) et de courant (\\(\\vec{j}=\\vec{0}\\)), que deviennent les équations de Maxwell ?|Les équations de Maxwell dans le vide s'écrivent :<br><img src="images/e12.PNG">|${PEM10}
10143|<span style="color: rgb(0, 255, 0);">(Marion Vincent)</span> Dans le cas du régime stationnaire (dérivées temporelles nulles), que deviennent les équations de Maxwell ?|Les équations de l'électrostatique et de la magnétostatique sont découplées :<br><img src="images/e13.PNG">|${PEM10}
10144|<span style="color: rgb(255, 170, 0);">(Daouda Cisse)</span> Comment retrouve-t-on l'équation de d'Alembert pour \\(\\vec{E}\\) dans une région vide de charge et de courant ?|On applique le rotationnel à l'équation de Maxwell-Faraday : \\(\\vec{rot}(\\vec{rot} \\vec{E}) = -\\frac{\\partial}{\\partial t}(\\vec{rot} \\vec{B})\\).<br>On utilise l'identité \\(\\vec{rot}(\\vec{rot} \\vec{E}) = \\vec{grad}(div \\vec{E}) - \\Delta \\vec{E}\\).<br>Dans le vide, \\(div \\vec{E} = 0\\) et \\(\\vec{rot} \\vec{B} = \\varepsilon_0 \\mu_0 \\frac{\\partial \\vec{E}}{\\partial t}\\).<br>On obtient : \\(-\\Delta \\vec{E} = -\\varepsilon_0 \\mu_0 \\frac{\\partial^2 \\vec{E}}{\\partial t^2}\\).<br>Soit l'équation d'onde : \\(\\Delta \\vec{E} - \\frac{1}{c^2} \\frac{\\partial^2 \\vec{E}}{\\partial t^2} = \\vec{0}\\).|${PEM10}
10145|<span style="color: rgb(0, 255, 0);">(Oceane Arabi)</span> Qu'est-ce que l'équation de Poisson (régime stationnaire) et comment la retrouve-t-on ?|L'équation de Poisson relie le potentiel V à la densité de charge \\(\\rho\\).<br>On part de Maxwell-Gauss : \\(div \\vec{E} = \\frac{\\rho}{\\varepsilon_0}\\).<br>On utilise la relation \\(\\vec{E} = -\\vec{grad}V\\).<br>On obtient \\(div(-\\vec{grad}V) = \\frac{\\rho}{\\varepsilon_0}\\).<br>Comme \\(div(\\vec{grad}V) = \\Delta V\\), on a :<br>\\[\\Delta V = -\\frac{\\rho}{\\varepsilon_0}\\]<img src="images/e18.PNG">|${PEM10}
10146|<span style="color: rgb(255, 170, 0);">(Vincent Marion)</span> Que devient l'équation de Poisson dans une zone vide de charge (en régime stationnaire) ?|Si \\(\\rho = 0\\), l'équation de Poisson devient l'<b>équation de Laplace</b> :<br>\\[\\Delta V = 0\\]<img src="images/e19.PNG">|${PEM10}
10147|Qu'est-ce que le vecteur densité volumique de courant de déplacement ? Et le courant de déplacement ?|<img src="images/paste-7efdc90615fbdb5476fdd210e9e5635b9591785b.jpg">|${PEM10}
10148|1. Comment s'écrit la loi de conservation de la charge en régime stationnaire ?<br>2. Quelle est la relation intégrale associée et quelle loi d'électrocinétique traduit-elle ?|1. En régime stationnaire, la densité de charge ne varie pas, donc \\(div(\\vec{j}) = 0\\).<br>2. La relation intégrale est \\(\\unicode{x222F}_{S_{fermée}} \\vec{j} \\cdot d\\vec{S} = 0\\). C'est la <b>loi des nœuds</b> : l'intensité totale qui sort d'un volume fermé est nulle.|${PEM10}
10149|<span style="color: rgb(255, 170, 0);">(M.A)</span> Quelles sont les correspondances pour les opérateurs \\(\\vec{\\nabla}\\) et \\(\\frac{\\partial}{\\partial t}\\) lorsqu'on passe en notation complexe pour une onde de la forme \\(\\vec{\\underline{E}}=\\vec{\\underline{E_0}}exp(j(\\omega t-\\vec{k}\\cdot\\vec{r}))\\) ?|En notation complexe, pour une onde progressive, les opérateurs deviennent de simples multiplications :<br>• Dérivée spatiale : \\(\\vec{\\nabla} \\longleftrightarrow -j\\vec{k}\\)<br>• Dérivée temporelle : \\(\\frac{\\partial}{\\partial t} \\longleftrightarrow j\\omega\\)|${PEM11}
10150|<span style="color: rgb(255, 170, 0);">(M.A)</span> Quelle est la solution générale de l'équation de d'Alembert unidimensionnelle (équation d'onde) : \\(\\frac{\\partial^2 f}{\\partial x^2} - \\frac{1}{c^2}\\frac{\\partial^2 f}{\\partial t^2} = 0\\) ?|La solution générale est la superposition de deux ondes se propageant en sens opposés :<br>\\[f(x,t) = g(t - x/c) + h(t + x/c)\\]ou de manière équivalente :<br>\\[f(x,t) = G(x - ct) + H(x + ct)\\]|${PEM11}
10151|<span style="color: rgb(255, 170, 0);">(M.A)</span> Que représentent les fonctions \\(g(t - x/c)\\) et \\(h(t + x/c)\\) ?|• \\(g(t - x/c)\\) représente une onde qui se propage <b>sans déformation</b> à la vitesse \\(c\\) dans le sens des <b>x croissants</b> (onde progressive).<br>• \\(h(t + x/c)\\) représente une onde qui se propage <b>sans déformation</b> à la vitesse \\(c\\) dans le sens des <b>x décroissants</b> (onde régressive).|${PEM11}
10152|<span style="color: rgb(255, 170, 0);">M.W</span><br>Soit \\(\\vec{E}(x,t) = E_{0y}\\cos(\\omega t-kx)\\vec{e_y}+E_{0z}\\cos(\\omega t-kx-\\phi)\\vec{e_z}\\).<br>1. Direction de propagation ?<br>2. Vecteur d'onde \\(\\vec{k}\\) ?<br>3. Pourquoi \\(E_x=0\\) ?<br>4. Champ \\(\\vec{B}\\) correspondant ?|1. La phase \\((\\omega t - kx)\\) indique une propagation dans la direction des <b>x croissants</b>.<br>2. \\(\\vec{k} = k\\vec{e_x} = \\frac{\\omega}{c}\\vec{e_x}\\).<br>3. Pour une onde plane dans le vide, le champ \\(\\vec{E}\\) est <b>transverse</b>, c'est-à-dire orthogonal à la direction de propagation.<br>4. \\(\\vec{B} = \\frac{\\vec{k} \\wedge \\vec{E}}{\\omega} = \\frac{1}{c}\\vec{e_x} \\wedge \\vec{E} = \\frac{1}{c}(-E_z\\vec{e_y} + E_y\\vec{e_z})\\).|${PEM11}
10153|<span style="color: rgb(255, 170, 0);">(M.A)</span> Que dire des champs \\(\\vec{E}\\) et \\(\\vec{B}\\) d'une Onde Plane Progressive (OPP) dans le vide ?|Pour une OPP dans le vide :<br>1. \\((\\vec{E}, \\vec{B}, \\vec{k})\\) forment un <b>trièdre direct</b>.<br>2. \\(\\vec{E}\\) et \\(\\vec{B}\\) sont <b>orthogonaux</b> entre eux.<br>3. \\(\\vec{E}\\) et \\(\\vec{B}\\) sont <b>orthogonaux</b> à la direction de propagation \\(\\vec{k}\\) (onde transverse).<br>4. Leurs normes sont liées par \\(E = cB\\).|${PEM11}
10154|<span style="color: rgb(255, 170, 0);">(M.A)</span> Si \\(\\vec{u}\\) est le vecteur unitaire de la direction de propagation, quelle relation permet de trouver \\(\\vec{B}\\) à partir de \\(\\vec{E}\\) pour une OPP dans le vide ?|\\[\\vec{B} = \\frac{1}{c} \\vec{u} \\wedge \\vec{E}\\]|${PEM11}
10155|<span style="color: rgb(255, 170, 0);">(M.A)</span> Qu'est-ce qu'une Onde Plane Progressive Monochromatique (OPPM) ?|Une OPPM est une Onde Plane Progressive dont la dépendance temporelle et spatiale est <b>sinusoïdale</b>, avec une seule pulsation \\(\\omega\\) (ou fréquence \\(f\\)).|${PEM11}
10156|<span style="color: rgb(255, 170, 0);">M.W</span><br>Proposer l'expression d'un champ \\(\\vec{E}\\) se propageant suivant \\(+\\vec{u_x}\\) avec une polarisation <b>circulaire gauche</b>, puis <b>circulaire droite</b>.|• <b>Circulaire gauche (sens trigonométrique) :</b><br>\\(\\vec{E}(x,t) = E_0[\\cos(\\omega t-kx)\\vec{e_y} + \\sin(\\omega t-kx)\\vec{e_z}]\\](Les composantes en y et z sont en quadrature de phase).<br>• <b>Circulaire droite (sens horaire) :</b><br>\\(\\vec{E}(x,t) = E_0[\\cos(\\omega t-kx)\\vec{e_y} - \\sin(\\omega t-kx)\\vec{e_z}]\\]|${PEM11}
10157|<span style="color: rgb(255, 170, 0);">M.W</span><br>Proposer une expression pour un champ \\(\\vec{E}\\) se propageant suivant \\(+\\vec{u_x}\\) et polarisé <b>rectilignement</b>.|La direction du vecteur \\(\\vec{E}\\) reste fixe au cours du temps. Par exemple :<br>\\(\\vec{E}(x,t) = E_0 \\cos(\\omega t - kx - \\phi) \\vec{u}\\)<br>où \\(\\vec{u}\\) est un vecteur constant dans le plan \\((y,z)\\), par exemple \\(\\vec{u}=\\vec{e_y}\\) ou \\(\\vec{u} = \\frac{1}{\\sqrt{2}}(\\vec{e_y} + \\vec{e_z})\\).|${PEM11}
10158|<span style="color: rgb(255, 170, 0);">(M.A)</span> Expression générale du champ \\(\\vec{E}\\) d'une OPPM se propageant dans le vide selon les x croissants ?|Le champ est transverse (composante en x nulle) :<br>\\(\\vec{E}(x,t) = E_{0y}\\cos(\\omega t - kx + \\phi_y)\\vec{e_y} + E_{0z}\\cos(\\omega t - kx + \\phi_z)\\vec{e_z}\\)<br>où \\(k = \\omega/c\\) est le nombre d'onde.|${PEM11}
10159|<span style="color: rgb(255, 170, 0);">(M.A)</span> Quelle est l'expression du vecteur d'onde \\(\\vec{k}\\) d'une OPPM se propageant dans le vide dans la direction du vecteur unitaire \\(\\vec{u}\\) ?|\\[\\vec{k} = \\frac{\\omega}{c}\\vec{u} = \\frac{2\\pi}{\\lambda}\\vec{u}\\]|${PEM11}
10160|<span style="color: rgb(0, 255, 0);">(BM)</span> Donner l'équation de d'Alembert tridimensionnelle pour \\(\\vec{E}\\).|\\[\\Delta\\vec{E} - \\frac{1}{c^2}\\frac{\\partial^2\\vec{E}}{\\partial t^2} = \\vec{0}\\]où \\(c = 1/\\sqrt{\\varepsilon_0 \\mu_0}\\) est la célérité de la lumière dans le vide.|${PEM11}
10161|<span style="color: rgb(0, 255, 0);">(A.P)</span> Donner l'expression, l'unité et le sens physique du vecteur de Poynting.|<img src="images/20240125_203524.jpg">|${PEM12}
10162|<span style="color: rgb(0, 255, 0);">(A.P)</span> Que dire du vecteur de Poynting d'une OPP dans le vide ?|<img src="images/img3435061267687801303.jpg">|${PEM12}
10163|(V.I) Donner la densité volumique d’énergie magnétique et son unité.|\\[u_M = \\frac{1}{2\\mu_0} B^2\\]Elle s'exprime en Joules par mètre cube (\\(J \\cdot m^{-3}\\)).|${PEM12}
10164|(V.I) Donner la densité volumique d’énergie électromagnétique en un point de l’espace où règne un champ \\((\\vec{E}, \\vec{B})\\).|\\[u_{em} = u_E + u_M = \\frac{1}{2}\\varepsilon_0 E^2 + \\frac{1}{2\\mu_0} B^2\\]Son unité est le Joule par mètre cube (\\(J \\cdot m^{-3}\\)).|${PEM12}
10165|(V.I) Quelles sont les conditions de validité de l'Approximation des Régimes Quasi-Stationnaires (ARQS) ?|L'ARQS est valide si le temps de propagation \\(\\tau\\) de l'information dans le circuit de taille L est très inférieur à la période T du signal.<br>• Condition sur les temps : \\(\\tau \\ll T\\)<br>• Condition sur les longueurs : \\(L \\ll \\lambda\\), où \\(\\lambda\\) est la longueur d'onde.|${PEM12}
10166|(V.I) Donner les Équations de Maxwell dans l’ARQS "magnétique".|Dans l'ARQS magnétique, on néglige le courant de déplacement dans l'équation de Maxwell-Ampère :<br>• \\(div \\vec{E} = \\frac{\\rho}{\\varepsilon_0}\\)<br>• \\(\\vec{rot} \\vec{E} = -\\frac{\\partial \\vec{B}}{\\partial t}\\)<br>• \\(div \\vec{B} = 0\\)<br>• \\(\\vec{rot} \\vec{B} = \\mu_0 \\vec{j}\\) (terme de Maxwell négligé)|${PEM12}
10167|(V.I) Donner les densités volumiques d'énergies électrique \\(u_E\\), magnétique \\(u_M\\) et électromagnétique \\(u_{em}\\) pour une OPP dans le vide.|Pour une OPP dans le vide, les densités d'énergie électrique et magnétique sont égales :<br>\\(u_E = u_M = \\frac{1}{2}\\varepsilon_0 E^2\\)<br>La densité d'énergie électromagnétique totale est donc :<br>\\(u_{em} = u_E + u_M = \\varepsilon_0 E^2\\)|${PEM12}
10168|<span style="color: rgb(0, 255, 0);">(E-S)</span> Puissance fournie par le champ électromagnétique à une charge q de vitesse v.|<img src="images/IMG_6162.jpg"><br>La puissance est le produit scalaire de la force de Lorentz \\(\\vec{F}\\) par la vitesse \\(\\vec{v}\\).|${PEM12}
10169|<span style="color: rgb(255, 170, 0);">(V.I)</span> Donner la loi d’Ohm "intégrale" puis la loi d’Ohm "locale".|• <b>Loi d'Ohm intégrale</b> (pour un dipôle) : \\(u = Ri\\)<br>• <b>Loi d'Ohm locale</b> (dans un matériau) : \\(\\vec{j} = \\gamma \\vec{E}\\)<br>où \\(\\gamma\\) est la conductivité du matériau en Siemens par mètre (\\(S \\cdot m^{-1}\\)).|${PEM12}
10170|(V.I) Définir un conducteur et un conducteur ohmique.|1. <b>Conducteur :</b> Milieu possédant des porteurs de charges mobiles (ex: électrons dans un métal, ions dans un électrolyte).<br>2. <b>Conducteur ohmique :</b> C'est un conducteur où il existe une relation de proportionnalité entre la densité de courant \\(\\vec{j}\\) et le champ électrique \\(\\vec{E}\\) : \\(\\vec{j} = \\gamma \\vec{E}\\).|${PEM12}
10171|(V.I) Retrouver l'expression de la densité volumique d'énergie électrique \\(u_E\\) dans le cas d'un condensateur plan.|L'énergie stockée dans un condensateur est \\(U_C = \\frac{1}{2}CU^2\\).<br>Pour un condensateur plan, \\(C = \\frac{\\varepsilon_0 S}{e}\\) et \\(U = E \\cdot e\\).<br>Donc \\(U_C = \\frac{1}{2} (\\frac{\\varepsilon_0 S}{e}) (Ee)^2 = \\frac{1}{2}\\varepsilon_0 E^2 (S \\cdot e)\\).<br>Le volume est \\(V_{ol} = S \\cdot e\\), donc la densité volumique d'énergie est :<br>\\(u_E = \\frac{U_C}{V_{ol}} = \\frac{1}{2}\\varepsilon_0 E^2\\)|${PEM12}

10173|<span style="color: rgb(0, 255, 0);">(E-S)</span> Bilan d'énergie sous forme intégrale.|<div><img src="images/IMG_6166.jpg"></div>|${PEM12}
10174|<span style="color: rgb(255, 170, 0);">(E-S)</span> Bilan d'énergie sous forme locale.|<img src="images/paste-99d771ded1438c4d97b496e50d4f1c3d318344c6.jpg">|${PEM12}
10175|<span style="color: rgb(255, 170, 0);">(O.M)</span> Dans une cavité conductrice parfaite de longueur \\(a\\), quelles sont les deux conditions que doit vérifier le champ \\(\\vec{E}\\) ?<br><img src="images/paste-d13b668f511ce3dc30a786d7467c62ae5210dd48.jpg">|1. <b>Conditions aux limites :</b> La composante tangentielle de \\(\\vec{E}\\) est nulle à la surface d'un conducteur parfait. Ici, \\(\\vec{E}\\) est tangent aux parois, donc :<br>\\(E(x=0, t) = 0\\) et \\(E(x=a, t) = 0\\) pour tout \\(t\\).<br>2. <b>Équation de propagation :</b> Le champ \\(\\vec{E}\\) doit être une solution de l'équation de d'Alembert dans le vide :<br>\\(\\Delta\\vec{E} - \\frac{1}{c^2}\\frac{\\partial^2\\vec{E}}{\\partial t^2} = \\vec{0}\\).|${PEM13}
10176|<span style="color: rgb(255, 170, 0);">(O.M)</span> Quelle est la forme mathématique générale du champ \\(\\vec{E}(x,t)=f(x)g(t)\\vec{u_z}\\) (onde stationnaire) dans la cavité ?<br><img src="images/paste-d13b668f511ce3dc30a786d7467c62ae5210dd48.jpg">|On cherche une solution à variables séparées de l'équation de d'Alembert. Cela conduit à deux équations différentielles :<br>\\(\\frac{d^2f}{dx^2} + k^2 f(x) = 0\\)<br>\\(\\frac{d^2g}{dt^2} + \\omega^2 g(t) = 0\\)<br>avec la relation de dispersion \\(k = \\omega/c\\).<br>Les solutions sont sinusoïdales :<br>\\(f(x) = A\\cos(kx) + B\\sin(kx)\\)<br>\\(g(t) = C\\cos(\\omega t) + D\\sin(\\omega t)\\)<br>Soit \\(\\vec{E}(x,t) = [A\\cos(kx) + B\\sin(kx)] \\cdot [C\\cos(\\omega t) + D\\sin(\\omega t)] \\vec{u_z}\\).|${PEM13}
10177|<span style="color: rgb(255, 170, 0);">(O.M)</span> En appliquant les conditions aux limites à \\(\\vec{E}(x,t) = (A\\cos(kx)+B\\sin(kx))g(t)\\vec{u_z}\\) dans la cavité, que trouve-t-on ?|• <b>En x=0 :</b> \\(E(0,t)=0 \\Rightarrow A \\cdot g(t) = 0 \\Rightarrow A=0\\). La solution est donc en \\(\\sin(kx)\\).<br>• <b>En x=a :</b> \\(E(a,t)=0 \\Rightarrow B\\sin(ka)g(t)=0 \\Rightarrow \\sin(ka)=0\\).<br>Ceci impose une quantification du nombre d'onde \\(k\\) :<br>\\(ka = p\\pi\\), où \\(p\\) est un entier non nul.<br>Soit \\(k_p = \\frac{p\\pi}{a}\\).<br>Les pulsations possibles (modes propres) sont donc \\(\\omega_p = c k_p = \\frac{p\\pi c}{a}\\).|${PEM13}
10178|<span style="color: rgb(255, 170, 0);">(O.M)</span> Le champ dans une cavité est \\(\\vec{E} = E_0 \\sin(\\frac{p\\pi x}{a})\\cos(\\omega_p t + \\phi)\\vec{u_z}\\). Que signifie \\(p\\) ?<br><img src="images/paste-d13b668f511ce3dc30a786d7467c62ae5210dd48.jpg">|Chaque entier \\(p \\ge 1\\) définit un <b>mode propre</b> de vibration de la cavité, caractérisé par :<br>• Une fréquence propre : \\(f_p = \\frac{\\omega_p}{2\\pi} = p \\frac{c}{2a}\\)<br>• Une longueur d'onde : \\(\\lambda_p = \\frac{c}{f_p} = \\frac{2a}{p}\\)<br>Le mode \\(p\\) correspond à une onde stationnaire ayant \\(p\\) fuseaux (ventres d'amplitude).<br><img src="images/paste-dee508805d69e2a4da947748c97fedcf4ae7a97d.jpg">|${PEM13}
10179|(L.S) Localiser les ventres et les nœuds de \\(\\vec{E}\\) et \\(\\vec{B}\\) pour l'onde stationnaire \\(\\vec{E} = 2E_{0i}\\sin(kz)\\sin(\\omega t)\\vec{u_x}\\).<br><img src="images/bleh.PNG">|Les nœuds de \\(\\vec{E}\\) (amplitude nulle) sont où \\(\\sin(kz)=0 \\Rightarrow kz=n\\pi\\).<br>Les ventres de \\(\\vec{E}\\) (amplitude max) sont où \\(|\\sin(kz)|=1 \\Rightarrow kz=(n+1/2)\\pi\\).<br>Pour \\(\\vec{B}\\), c'est l'inverse (car il est en \\(\\cos(kz)\\)). Les nœuds de \\(\\vec{E}\\) sont les ventres de \\(\\vec{B}\\) et vice-versa.<br><img src="images/Ajouter des lignes dans le corps du texte.png">|${PEM13}
10180|(L.S) Une onde \\(\\underline{\\vec{E}_i} = E_{0i}e^{j(kz-\\omega t)}\\vec{u_x}\\) se réfléchit sur un conducteur parfait en z=0 (incidence normale). Donner \\(\\underline{\\vec{E}_r}\\).<br><img src="images/paste-19049a52659cbc68fe9fc14d3fdba63fb6d0d43f.jpg">|L'onde réfléchie se propage en \\(-z\\) : \\(\\underline{\\vec{E}_r} = \\underline{\\vec{E}_{0r}}e^{j(-kz-\\omega t)}\\).<br>La condition aux limites en z=0 est que le champ total tangentiel est nul : \\(\\vec{E}_i(0,t) + \\vec{E}_r(0,t) = \\vec{0}\\).<br>\\(E_{0i}e^{-j\\omega t}\\vec{u_x} + \\underline{\\vec{E}_{0r}}e^{-j\\omega t} = \\vec{0}\\).<br>Ceci impose \\(\\underline{\\vec{E}_{0r}} = -E_{0i}\\vec{u_x}\\).<br>L'onde réfléchie est donc : \\(\\underline{\\vec{E}_r} = -E_{0i}e^{j(-kz-\\omega t)}\\vec{u_x}\\).<br>Il y a un déphasage de \\(\\pi\\) pour \\(\\vec{E}\\) à la réflexion.|${PEM13}
10181|(L.S) Pour une réflexion sur un conducteur parfait, on a \\(\\vec{E}_i = E_{0i}\\cos(kz-\\omega t)\\vec{u_x}\\) et \\(\\vec{E}_r = -E_{0i}\\cos(kz+\\omega t)\\vec{u_x}\\). Déterminer \\(\\vec{B}_i\\) et \\(\\vec{B}_r\\).|On utilise \\(\\vec{B} = \\frac{\\vec{k} \\wedge \\vec{E}}{\\omega}\\).<br>Pour l'onde incidente, \\(\\vec{k}_i=k\\vec{u_z}\\) :<br>\\(\\vec{B}_i = \\frac{k\\vec{u_z} \\wedge E_{0i}\\cos(...)\\vec{u_x}}{\\omega} = \\frac{E_{0i}}{c}\\cos(kz-\\omega t)\\vec{u_y}\\).<br>Pour l'onde réfléchie, \\(\\vec{k}_r=-k\\vec{u_z}\\) :<br>\\(\\vec{B}_r = \\frac{-k\\vec{u_z} \\wedge (-E_{0i}\\cos(...))\\vec{u_x}}{\\omega} = \\frac{E_{0i}}{c}\\cos(kz+\\omega t)\\vec{u_y}\\).<br>Note : Il n'y a pas de déphasage pour \\(\\vec{B}\\) à la réflexion.|${PEM13}
10182|Le champ \\(\\vec{E}\\) dans une cavité est de la forme \\(\\vec{E}(x,t) = f(x)g(t)\\vec{u_z}\\). Quelle est la nature de cette onde ?|C'est une <b>onde stationnaire</b> : elle n'est pas de la forme \\(F(t-x/c)\\) ou \\(G(t+x/c)\\). Les variables d'espace et de temps sont séparées.\\nElle résulte de la superposition de deux ondes progressives se propageant en sens opposés, créées par les réflexions successives sur les parois de la cavité.|${PEM13}
10183|(MAG) Équation de propagation du champ E dans un conducteur ohmique.<br><img src="images/paste-51401275d15bbf37d7e168a56c64ee7635c23923.jpg">|<img src="images/paste-b1d8356e3e5a085afb59e2d76355ab2195bb7a80.jpg">|${PEM13}
10184|(MAG) Relation de dispersion pour une OPPM dans un conducteur ohmique.<br>Rappel : \\(\\Delta\\vec{E} - \\mu_0\\gamma\\frac{\\partial\\vec{E}}{\\partial t} - \\varepsilon_0\\mu_0\\frac{\\partial^2\\vec{E}}{\\partial t^2} = \\vec{0}\\).<br><img src="images/paste-8e1bfb99783c1fd684cd404ef15d5918094dfd01.jpg">|<img src="images/paste-354ec4f941ffbcf92ed82f4736d592d5dc834cd0.jpg">|${PEM13}
